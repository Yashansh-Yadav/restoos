# RestoOS CI (plan M0-T4): typecheck + lint + unit/integration tests, production build, E2E.
# Runs on every push and pull request to main once the repo is on GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Same images and host ports as docker-compose.yml, so .env.example works unchanged.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: restoos
          POSTGRES_PASSWORD: restoos
          POSTGRES_DB: restoos
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U restoos -d restoos"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Environment
        run: cp .env.example .env

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Migrate dev database
        run: pnpm db:migrate:deploy

      - name: Typecheck, lint, unit + integration tests
        run: pnpm check

      - name: Production build
        run: pnpm build

      - name: E2E (Playwright, installed Chrome)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
