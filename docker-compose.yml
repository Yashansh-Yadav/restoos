# Local development infrastructure (plan §2, M0-T2). Production uses RDS + managed Redis (§14).
# Host ports are non-default (5434, 6380) so they don't collide with a locally installed
# Postgres/Redis or other projects' containers on 5432/5433/6379.
name: restoos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: restoos
      POSTGRES_PASSWORD: restoos
      POSTGRES_DB: restoos
      TZ: Asia/Kolkata
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restoos -d restoos"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
